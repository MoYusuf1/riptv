name: FFmpeg build

# Builds the minimal ffmpeg/ffprobe that releases bundle (scripts/build_ffmpeg.sh). A push that
# changes the script only builds; running it by hand publishes a pre-release, whose hashes then
# go in scripts/ffmpeg.json. Pre-releases are never offered as app updates.
on:
  push:
    paths: ['scripts/build_ffmpeg.sh', '.github/workflows/ffmpeg.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the binaries (e.g. ffmpeg-n8.1.3-1)
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-22.04, setup: 'sudo apt-get update && sudo apt-get install -y nasm' }
          - { platform: windows-x64, runner: ubuntu-24.04, setup: 'sudo apt-get update && sudo apt-get install -y nasm mingw-w64' }
          - { platform: macos-arm64, runner: macos-15, setup: 'brew install nasm pkgconf' }
          - { platform: macos-x64, runner: macos-15-intel, setup: 'brew install nasm pkgconf' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ${{ matrix.setup }}
      - run: scripts/build_ffmpeg.sh ${{ matrix.platform }} out
      - name: Name by platform
        shell: bash
        run: |
          cd out
          for tool in ffmpeg ffprobe; do
            if [ -f $tool.exe ]; then mv $tool.exe $tool-${{ matrix.platform }}.exe; else mv $tool $tool-${{ matrix.platform }}; fi
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: |
            out/ffmpeg-*
            out/ffprobe-*
            out/ffmpeg-sources.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: parts
      - name: Publish a pre-release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir assets
          cp parts/*/ffmpeg-*-* parts/*/ffprobe-* assets/
          # Every platform builds from the same pinned sources; publish them once.
          cp parts/ffmpeg-linux-x64/ffmpeg-sources.tar.gz assets/
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Bundled FFmpeg ($TAG)" --notes "Minimal FFmpeg built by scripts/build_ffmpeg.sh for RIPTV downloads. Corresponding source: ffmpeg-sources.tar.gz." ./*
