name: Release downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-and-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("proxy/Cargo.toml", "rb"))["package"]["version"])')
          if [ "$RELEASE_TYPE" = tag ]; then test "$RELEASE_REF" = "v$version"; fi
          # Every release states what it improved, in numbers (docs/changes.md keeps the record).
          grep -q '^## What improved' docs/release-notes.md && grep -q '^| ' docs/release-notes.md \
            || { echo "docs/release-notes.md needs a 'What improved' table"; exit 1; }
          grep -q "^## $version\$" docs/changes.md || { echo "docs/changes.md needs a section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rust and web tooling
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          curl -fL --retry 3 -o /tmp/dx-x86_64-unknown-linux-gnu.zip https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.zip
          curl -fL --retry 3 -o /tmp/dioxus.sha256 https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.sha256
          cd /tmp
          grep ' dx-x86_64-unknown-linux-gnu.zip$' dioxus.sha256 | sha256sum -c -
          unzip dx-x86_64-unknown-linux-gnu.zip -d dioxus
          chmod +x dioxus/dx
          echo /tmp/dioxus >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/wasm32-unknown-unknown
            target/release
          key: release-web-${{ hashFiles('Cargo.lock') }}
      - name: Build web app
        run: dx build --web --release --locked -p app
      - name: Collect FFmpeg corresponding source and licenses
        run: python scripts/release_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: target/dx/app/release/web/public
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-sources
          path: target/release-sources
          if-no-files-found: error

  native:
    needs: web-and-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: riptv
            rustflags: ''
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            executable: riptv.exe
            rustflags: '-C target-feature=+crt-static'
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            executable: riptv
            rustflags: ''
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: riptv
            rustflags: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      PACKAGE_VERSION: ${{ needs.web-and-sources.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: release-static-crt-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: target/dx/app/release/web/public
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-sources
          path: target/release-sources
      - name: Build native executable
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: cargo build --release --locked -p riptv --target ${{ matrix.target }}
      - name: Download dependency notices
        run: cargo fetch --locked
      - name: Package with verified bundled media tools
        run: python scripts/package.py --platform ${{ matrix.platform }} --version "$PACKAGE_VERSION" --target ${{ matrix.target }} --server target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Test extracted application and bundled conversion
        run: python scripts/smoke_package.py target/packages/*
      - name: Playback in Chrome through the packaged app (end to end)
        if: matrix.platform == 'linux-x64'
        run: |
          cd e2e && npm ci
          RIPTV_BIN="$(cd .. && pwd)/target/packages/RIPTV-Linux" npm test
      - name: Unit and integration tests with bundled FFmpeg
        run: |
          export PATH="$PWD/target/test-tools/${{ matrix.platform }}/bin:$PATH"
          cargo test --locked -p xtream -p riptv --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ matrix.platform }}
          path: target/packages/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, web-and-sources]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: download-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-sources
          path: ffmpeg-sources
      - name: Checksums and publish only after all native tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.web-and-sources.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          cp ffmpeg-sources/ffmpeg-sources-*.tar.gz release-assets/
          cd release-assets
          sha256sum RIPTV-* ffmpeg-sources-* > SHA256SUMS.txt
          # The notes, then this release's measured download sizes.
          cp ../docs/release-notes.md ../notes.md
          printf '\n## Download sizes\n\n| Download | Size |\n|---|---|\n' >> ../notes.md
          for f in RIPTV-*; do echo "| \`$f\` | $(awk -v b="$(wc -c < "$f")" 'BEGIN { printf "%.1f MB", b / 1e6 }') |" >> ../notes.md; done
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "RIPTV $RELEASE_VERSION" --notes-file ../notes.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./*
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
