[package]
name = "riptv"
version = "0.1.0"
edition = "2024"
description = "Localhost pass-through proxy + dev page for the IPTV client"

[lib]
name = "iptv_proxy"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
reqwest = { version = "0.13.5", features = ["rustls", "stream"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
serde_json = "1.0.151"
xtream = { path = "../xtream" }
