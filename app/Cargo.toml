[package]
name = "app"
version = "0.1.0"
edition = "2024"
description = "Dioxus web UI for the IPTV client"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["web", "launch", "macro", "html", "signals", "hooks"] }
rstreamkit = { version = "0.1.0", git = "ssh://git@github.com/MoYusuf1/rstreamkit.git" }
futures-core = "0.3"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["Window", "Location", "Document", "Element", "EventTarget", "Headers", "Request", "RequestInit", "Response", "ReadableStream", "ReadableStreamDefaultReader", "HtmlVideoElement", "HtmlMediaElement", "KeyboardEvent", "Node", "Storage", "TimeRanges", "VideoPlaybackQuality", "console"] }
xtream = { version = "0.1.0", path = "../xtream" }
